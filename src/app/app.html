<header class="navbar">
  <a class="brand" routerLink="/">
    <span class="brand-icon">P360</span>

    <div>
      <strong>Pedidos360</strong>
      <small>Gestión para cafeterías y panaderías</small>
    </div>
  </a>

  <nav class="nav-links">
    <a
      routerLink="/"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </a>

    @if (account) {
      <a routerLink="/panel" routerLinkActive="active">
        Panel
      </a>

      <a routerLink="/pedidos" routerLinkActive="active">
        Pedidos
      </a>

      <div class="user-menu">
        <div class="user-info">

          <div
            class="user-avatar"
            [attr.title]="account.username">

            {{ account.name?.charAt(0)?.toUpperCase() ?? 'U' }}

          </div>

          <div class="user-meta">
            <span class="user-email">
              {{ account.name ?? account.username }}
            </span>

            <span class="user-role">
              Operador
            </span>
          </div>

        </div>
      </div>

      <button
        type="button"
        class="logout-btn"
        (click)="logout()">
        Cerrar sesión
      </button>

    } @else {

      <button
        type="button"
        class="login-link"
        (click)="login()">
        Iniciar sesión
      </button>

    }
  </nav>
</header>

<main class="page-content">
  <router-outlet />
</main>

<footer class="footer">
  <div>
    <strong>Pedidos360</strong>
    <p>Plataforma de gestión para cafeterías y panaderías.</p>
  </div>

  <p>© 2026 Pedidos360</p>
</footer>
